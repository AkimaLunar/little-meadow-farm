<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Little Meadow Farm, Cassidy, BC. Peonies, daffodils, sunflowers, lavender and meadow flowers. Wholesale: admin@littlemeadow.farm">
<meta name="theme-color" content="#1d1a16">
<link rel="preload" href="assets/native-record-script.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/meadow.jpg" as="image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27%23f2d68f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23fbf8f1%27/%3E%3C/svg%3E">
<title>Little Meadow Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
@font-face { font-family: "NR Script"; src: url("assets/native-record-script.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "NR Serif";  src: url("assets/native-record-serif.woff2") format("woff2");  font-display: swap; }
@font-face { font-family: "NR Sans";   src: url("assets/native-record-sans.woff2") format("woff2");   font-display: swap; }

/* Layout: an old photographic print on a linen table. Inside the white border, the meadow is
   painted onto ecru paper with ragged watercolour edges; the type sits centred like a
   hand-lettered label, and specks of fluff drift through the morning light. */
:root {
  --table: #e8e1d5;
  --table-shade: #d9d0c1;
  --photo: #fbf8f1;           /* white border of the print */
  --cream: #f6ebd3;           /* lettering */
  --cream-dim: rgb(246 235 211 / .92);
  --butter: #f2d68f;
  --lavender: #cdbde6;
  --caption: #8f857a;
  --table-ink: #5f564b;       /* type set on the table, outside the print */
  --table-accent: #9a7b3c;
  --shadow: 46 36 24;

  --script: "NR Script", "Segoe Script", "Snell Roundhand", cursive;
  --serif:  "NR Serif", "Rockwell", Georgia, serif;
  --sans:   "NR Sans", "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --text:   "Jost", "Futura", "Century Gothic", system-ui, sans-serif;   /* small type */

  --edge: clamp(10px, 2.3vmin, 26px);
  --gutter: clamp(16px, 3.4vmin, 44px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --table: #1d1a16; --table-shade: #13110e; --table-ink: #cfc5b4; --table-accent: #e2c27a; --shadow: 0 0 0; color-scheme: dark; }
}
:root[data-theme="dark"] { --table: #1d1a16; --table-shade: #13110e; --table-ink: #cfc5b4; --table-accent: #e2c27a; --shadow: 0 0 0; color-scheme: dark; }

html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, var(--table) 0%, var(--table-shade) 100%);
  color: var(--cream);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

.stage {
  box-sizing: border-box; height: 100%;
  padding-inline: var(--gutter); padding-block: var(--gutter);
  display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: center;
  gap: clamp(.8rem, 2.4vh, 1.6rem);
}

/* The print */
.print {
  box-sizing: border-box;
  width: 100%; max-width: 1280px;
  height: 100%; max-height: 900px;
  display: grid; grid-template-rows: 1fr auto;
  padding: var(--edge) var(--edge) 0;
  background: var(--photo);
  border-radius: 3px;
  transform: rotate(-0.35deg);
  box-shadow:
    0 1px 1px rgb(var(--shadow) / .10),
    0 6px 14px -4px rgb(var(--shadow) / .18),
    0 30px 64px -20px rgb(var(--shadow) / .34);
  position: relative;
}
.print::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(140% 120% at 50% 50%, transparent 70%, rgb(180 160 120 / .10) 100%);
}

.plate {
  position: relative; overflow: hidden; min-height: 0;
  background-color: var(--photo);
}
.plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#meadow { filter: url(#watercolour); }

.caption {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding-block: calc(var(--edge) * .5) calc(var(--edge) * .65);
  padding-inline: .2rem;
  color: var(--caption);
}
.caption { font-family: var(--text); font-weight: 500; font-size: clamp(.68rem, .55vmin + .5rem, .84rem); letter-spacing: .2em; text-transform: uppercase; }
.caption .where { display: flex; align-items: center; gap: .9em; flex-wrap: wrap; }
.caption .where i { width: 1px; height: 1em; background: currentColor; opacity: .5; }
.caption .note { font-style: italic; font-weight: 400; text-transform: none; letter-spacing: .04em; font-size: 1.12em; }

/* Lettering */
.card {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: clamp(1rem, 4vmin, 3rem);
  overflow: auto;
}
.content {
  max-width: 46rem; text-align: center;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(.55rem, 2.1vh, 1.5rem);
  text-shadow: 0 1px 2px rgb(20 14 8 / .35), 0 0 28px rgb(20 14 8 / .35);
}
.content p { margin: 0; }
.content .small { text-shadow: 0 1px 2px rgb(20 14 8 / .6), 0 0 14px rgb(20 14 8 / .55); }

.kicker { font-family: var(--sans); font-size: clamp(.95rem, min(2.1vw, 2.4vh), 1.3rem); letter-spacing: .34em; padding-left: .34em; color: var(--cream); }

h1 { margin: 0; font-weight: 400; display: flex; flex-direction: column; align-items: center; line-height: .82; }
h1 .name {
  font-family: var(--script);
  font-size: clamp(3.6rem, min(14.5vw, 17vh), 10.5rem);
  color: var(--cream);
  padding-inline: .1em;
}
h1 .farm {
  font-family: var(--serif);
  font-size: clamp(2.2rem, min(8.6vw, 10vh), 6.2rem);
  letter-spacing: .14em; padding-left: .14em;
  margin-top: .08em;
  color: var(--cream);
}

.season { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; row-gap: .7rem; }
.season li {
  display: grid; justify-items: center; gap: .1rem;
  padding-inline: clamp(.7rem, 2vw, 1.4rem);
  border-left: 1px solid rgb(246 235 211 / .45);
}
.season li:first-child { border-left: 0; }
.season .f { font-family: var(--sans); font-size: clamp(.92rem, min(2vw, 2.3vh), 1.28rem); letter-spacing: .1em; }
.season .m { font-family: var(--text); font-weight: 500; font-size: clamp(.82rem, min(1.6vw, 1.9vh), 1rem); letter-spacing: .06em; color: var(--butter); line-height: 1.3; }


/* Wholesale line, set on the table under the print */
.wholesale {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: .35rem 1rem;
  color: var(--table-ink); text-align: center;
}
.wholesale { font-family: var(--text); font-weight: 500; font-size: clamp(.78rem, .5vmin + .58rem, .9rem); letter-spacing: .2em; text-transform: uppercase; }
.mail {
  font: inherit; letter-spacing: inherit;
  color: var(--table-ink); text-decoration: none;
  padding-bottom: .1em; border-bottom: 1px solid var(--table-accent);
  transition: color .25s;
}
.mail:hover { color: var(--table-accent); }
.mail:focus-visible { outline: 2px solid var(--table-accent); outline-offset: 4px; border-radius: 3px; }

/* Entrance */
.content > * { animation: rise 1.6s cubic-bezier(.2,.7,.2,1) both; }
.content > :nth-child(2) { animation-delay: .15s; }
.content > :nth-child(3) { animation-delay: .35s; }
.content > :nth-child(4) { animation-delay: .5s; }
.content > :nth-child(5) { animation-delay: .65s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .content > * { animation: none; } }

@media (max-width: 560px) {
  .print { transform: none; }
  .season { display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 20rem; }
  .season li:nth-child(3) { border-left: 0; }
  .caption .note { display: none; }
}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="watercolour" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="wobble"/>
    <feDisplacementMap in="SourceGraphic" in2="wobble" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<main class="stage">
  <article class="print" aria-label="Little Meadow Farm">
    <div class="plate" id="plate">
      <canvas id="meadow" aria-hidden="true"></canvas>
      <canvas id="air" aria-hidden="true"></canvas>
      <div class="card">
        <div class="content">
          <p class="kicker">FLEURS DE SAISON</p>
          <h1><span class="name">Little Meadow</span><span class="farm">FARM</span></h1>
          <ul class="season" aria-label="Bloom calendar">
            <li><span class="f">DAFFODILS</span><span class="m small">Mar – Apr</span></li>
            <li><span class="f">PEONIES</span><span class="m small">May – Jun</span></li>
            <li><span class="f">LAVENDER</span><span class="m small">Jun – Aug</span></li>
            <li><span class="f">SUNFLOWERS</span><span class="m small">Jul – Sep</span></li>
          </ul>
        </div>
      </div>
    </div>
    <footer class="caption">
      <span class="where"><span>Cassidy, BC</span><i aria-hidden="true"></i><span>Vancouver Island</span></span>
      <span class="note">le petit pré</span>
    </footer>
  </article>
  <footer class="wholesale">
    <span class="label">Wholesale orders</span>
    <a class="mail" href="mailto:admin@littlemeadow.farm">ADMIN@LITTLEMEADOW.FARM</a>
  </footer>
</main>

<script>
(() => {
  const plate = document.getElementById('plate');
  const meadow = document.getElementById('meadow');
  const air = document.getElementById('air');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const img = new Image();
  img.src = "assets/meadow.jpg";

  let W = 0, H = 0, dpr = 1, grainTile = null;

  /* seeded randomness for the painted edge */
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let R = mulberry(1);
  const gauss = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  function deform(pts, depth, amt) {
    for (let d = 0; d < depth; d++) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        const len = Math.hypot(b.x - a.x, b.y - a.y), v = (a.v + b.v) / 2;
        out.push(a, { x: (a.x + b.x) / 2 + gauss() * len * v * amt, y: (a.y + b.y) / 2 + gauss() * len * v * amt, v: v * (0.85 + R() * 0.25) });
      }
      pts = out;
    }
    return pts;
  }
  function rectPoly(inset, per) {
    const pts = [], x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset;
    const side = (ax, ay, bx, by) => { for (let i = 0; i < per; i++) { const t = i / per; pts.push({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t, v: 0.4 + R() * 0.9 }); } };
    side(x0, y0, x1, y0); side(x1, y0, x1, y1); side(x1, y1, x0, y1); side(x0, y1, x0, y0);
    return pts;
  }
  function trace(c, p) { c.beginPath(); c.moveTo(p[0].x, p[0].y); for (let i = 1; i < p.length; i++) c.lineTo(p[i].x, p[i].y); c.closePath(); }
  const off = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  /* ---------- the painted meadow ---------- */
  function paintMeadow() {
    if (!img.complete || !img.naturalWidth) return;
    const pw = Math.round(W * dpr), ph = Math.round(H * dpr);
    meadow.width = pw; meadow.height = ph;

    // 1. photo, cover-fit, softened toward a watercolour palette
    const pic = off(pw, ph), p = pic.getContext('2d');
    const s = Math.max(pw / img.naturalWidth, ph / img.naturalHeight);
    const iw = img.naturalWidth * s, ih = img.naturalHeight * s;
    p.filter = 'saturate(0.95) contrast(1.02) brightness(1.02) sepia(0.06)';
    p.drawImage(img, (pw - iw) * 0.62, (ph - ih) * 0.5, iw, ih);
    p.filter = 'none';
    // pigment wash: deepen the centre for the lettering, warm the morning sun
    let g = p.createRadialGradient(pw / 2, ph * 0.5, 0, pw / 2, ph * 0.5, Math.max(pw, ph) * 0.62);
    g.addColorStop(0, 'rgba(30,22,16,0.40)'); g.addColorStop(0.55, 'rgba(30,22,16,0.18)'); g.addColorStop(1, 'rgba(30,22,16,0)');
    p.fillStyle = g; p.fillRect(0, 0, pw, ph);
    p.globalCompositeOperation = 'screen';
    g = p.createRadialGradient(pw * 0.9, -ph * 0.05, 0, pw * 0.9, -ph * 0.05, Math.max(pw, ph) * 0.55);
    g.addColorStop(0, 'rgba(250,210,150,0.5)'); g.addColorStop(1, 'rgba(250,206,140,0)');
    p.fillStyle = g; p.fillRect(0, 0, pw, ph);
    // paper grain, only where there is paint
    p.globalCompositeOperation = 'multiply'; p.globalAlpha = 0.28;
    p.fillStyle = p.createPattern(grainTile, 'repeat'); p.fillRect(0, 0, pw, ph);
    p.globalAlpha = 1; p.globalCompositeOperation = 'source-over';

    // 2. ragged watercolour edge as a mask
    R = mulberry(2021);
    const m = Math.min(W, H) * 0.03;
    const mask = off(pw, ph), mc = mask.getContext('2d');
    mc.scale(dpr, dpr);
    const base = deform(rectPoly(m * 0.75, 7), 2, 0.04);
    for (let i = 0; i < 40; i++) { mc.fillStyle = 'rgba(0,0,0,0.06)'; trace(mc, deform(base, 3, 0.045)); mc.fill(); }
    mc.filter = `blur(${m * 0.9}px)`; mc.fillStyle = '#000';
    mc.fillRect(m * 2.2, m * 2.2, W - m * 4.4, H - m * 4.4);
    mc.filter = 'none';

    // 3. pigment pooling along the edge
    p.save(); p.scale(dpr, dpr);
    for (let i = 0; i < 5; i++) { p.strokeStyle = 'rgba(60,40,26,0.06)'; p.lineWidth = m * 0.35; trace(p, deform(base, 3, 0.03)); p.stroke(); }
    p.restore();

    p.globalCompositeOperation = 'destination-in';
    p.drawImage(mask, 0, 0);

    const ctx = meadow.getContext('2d');
    ctx.clearRect(0, 0, pw, ph);
    ctx.drawImage(pic, 0, 0);
  }

  /* ---------- paper grain ---------- */
  function paintGrain() {
    const size = 220, c = off(size, size), x = c.getContext('2d'), d = x.createImageData(size, size);
    R = mulberry(7);
    for (let i = 0; i < d.data.length; i += 4) { const v = 205 + R() * 50; d.data[i] = v; d.data[i + 1] = v * 0.97; d.data[i + 2] = v * 0.9; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0);
    grainTile = c;
  }

  /* ---------- sun rays + floating fluff ---------- */
  const actx = air.getContext('2d');
  let rays = [], raysCanvas = null, sun = { x: 0, y: 0 }, specks = [], sprites = null, L = 0;

  function buildRays() {
    sun = { x: W * 0.9, y: -H * 0.1 };
    L = Math.hypot(W, H) * 1.1;
    // angles pointing down-left from the sun (canvas radians: 0 = right, PI/2 = down)
    const centre = Math.atan2(H * 0.6 - sun.y, W * 0.3 - sun.x);
    R = mulberry(33);
    rays = [];
    for (let i = 0; i < 7; i++) rays.push({ a: centre + (i - 3) * 0.11 + (R() - 0.5) * 0.05, w: 0.018 + R() * 0.035, k: 0.45 + R() * 0.55 });
    raysCanvas = off(Math.round(W * dpr), Math.round(H * dpr));
    const r = raysCanvas.getContext('2d');
    r.scale(dpr, dpr);
    r.filter = `blur(${Math.max(8, Math.min(W, H) * 0.025)}px)`;
    for (const ray of rays) {
      const g = r.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, L);
      g.addColorStop(0, `rgba(255,232,186,${0.5 * ray.k})`);
      g.addColorStop(0.6, `rgba(255,232,186,${0.2 * ray.k})`);
      g.addColorStop(1, 'rgba(255,232,186,0)');
      r.fillStyle = g;
      r.beginPath(); r.moveTo(sun.x, sun.y); r.arc(sun.x, sun.y, L, ray.a - ray.w, ray.a + ray.w); r.closePath(); r.fill();
    }
  }
  function lightAt(x, y, sway) {
    const a = Math.atan2(y - sun.y, x - sun.x) - sway, d = Math.hypot(x - sun.x, y - sun.y) / L;
    let v = 0;
    for (const ray of rays) { const t = (a - ray.a) / (ray.w * 1.4); v += ray.k * Math.exp(-t * t); }
    return Math.min(1, v) * Math.max(0, 1 - d * 0.9);
  }

  function buildSprites() {
    const glow = off(64, 64), g = glow.getContext('2d');
    const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(255,254,250,1)'); rg.addColorStop(0.28, 'rgba(255,252,242,0.95)');
    rg.addColorStop(0.5, 'rgba(255,244,222,0.35)'); rg.addColorStop(1, 'rgba(255,240,214,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
    // a dandelion-style seed: a bright point with fine radiating filaments
    const seed = off(96, 96), s = seed.getContext('2d');
    s.drawImage(glow, 32, 32, 32, 32);
    s.strokeStyle = 'rgba(255,252,242,0.75)'; s.lineWidth = 0.9; s.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2 + (i % 2) * 0.12, r1 = 5, r2 = 22 + (i % 3) * 5;
      s.beginPath(); s.moveTo(48 + Math.cos(a) * r1, 48 + Math.sin(a) * r1); s.lineTo(48 + Math.cos(a) * r2, 48 + Math.sin(a) * r2); s.stroke();
    }
    const halo = s.createRadialGradient(48, 48, 0, 48, 48, 40);
    halo.addColorStop(0, 'rgba(255,248,230,0.25)'); halo.addColorStop(1, 'rgba(255,248,230,0)');
    s.fillStyle = halo; s.fillRect(0, 0, 96, 96);
    sprites = { glow, seed };
  }

  function buildSpecks() {
    R = mulberry(5150);
    const n = Math.round(Math.min(240, Math.max(90, W * H / 4200)));
    specks = Array.from({ length: n }, () => {
      const z = Math.pow(R(), 1.35);              // most specks are far away and tiny
      return {
        x: R() * W, y: R() * H, z,
        size: 4.5 + z * 11, seed: z > 0.72 && R() < 0.6,
        p1: R() * 6.28, p2: R() * 6.28, p3: R() * 6.28,
        f1: 0.08 + R() * 0.18, f2: 0.06 + R() * 0.15,
        spin: (R() - 0.5) * 0.6, rot: R() * 6.28
      };
    });
  }

  let last = 0, t0 = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    const t = (now - t0) / 1000;
    const sway = Math.sin(t * 0.12) * 0.022 + Math.sin(t * 0.05) * 0.012;
    const breathe = 0.82 + Math.sin(t * 0.35) * 0.1 + Math.sin(t * 0.9) * 0.04;

    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.clearRect(0, 0, air.width, air.height);
    // rays
    actx.globalCompositeOperation = 'screen';
    actx.globalAlpha = breathe;
    actx.translate(sun.x * dpr, sun.y * dpr); actx.rotate(sway); actx.translate(-sun.x * dpr, -sun.y * dpr);
    actx.drawImage(raysCanvas, 0, 0);
    actx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // fluff
    actx.globalCompositeOperation = 'source-over';
    for (const p of specks) {
      const zf = 0.35 + p.z;
      p.x += (-3.5 + Math.sin(t * p.f1 + p.p1) * 7 + Math.sin(t * 0.31 + p.p3) * 2) * zf * dt;
      p.y += (-1.6 + Math.sin(t * p.f2 + p.p2) * 5) * zf * dt;
      p.rot += p.spin * dt;
      const pad = 40;
      if (p.x < -pad) p.x = W + pad; else if (p.x > W + pad) p.x = -pad;
      if (p.y < -pad) p.y = H + pad; else if (p.y > H + pad) p.y = -pad;

      const lit = lightAt(p.x, p.y, sway);
      const twinkle = 0.8 + 0.2 * Math.sin(t * (1.3 + p.f1 * 6) + p.p3);
      const a = (0.5 + 0.5 * lit) * twinkle * (0.6 + 0.4 * p.z);
      if (a < 0.02) continue;
      actx.globalAlpha = Math.min(1, a);
      if (p.seed) {
        const s = p.size * 1.7;
        actx.save(); actx.translate(p.x, p.y); actx.rotate(p.rot);
        actx.drawImage(sprites.seed, -s / 2, -s / 2, s, s);
        actx.restore();
      } else {
        const s = p.size;
        actx.drawImage(sprites.glow, p.x - s / 2, p.y - s / 2, s, s);
      }
    }
    actx.globalAlpha = 1; actx.globalCompositeOperation = 'source-over';
    if (!reduce) requestAnimationFrame(frame);
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = plate.clientWidth; H = plate.clientHeight;
    air.width = Math.round(W * dpr); air.height = Math.round(H * dpr);
    paintGrain(); paintMeadow(); buildRays(); buildSpecks();
  }

  if (!sprites) buildSprites();
  layout();
  img.decode ? img.decode().then(paintMeadow, paintMeadow) : (img.onload = paintMeadow);
  requestAnimationFrame(frame);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); if (reduce) requestAnimationFrame(frame); }, 150); });

})();
</script>

</body>
